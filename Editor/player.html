<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Subtitle Burner (FFmpeg WASM)</title>
  <style>
    body { font-family: system-ui, Arial; padding: 18px; max-width: 760px; margin: auto; }
    h2 { margin-bottom: 6px; }
    .muted { opacity: 0.7; font-size: 14px; }
    .card { padding: 14px; border: 1px solid #ddd; border-radius: 12px; margin-top: 12px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
    button { padding: 10px 14px; border-radius: 10px; border: none; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    select, input[type=file] { padding: 8px; }
    progress { width: 100%; height: 20px; margin-top: 10px; }
    .ok { color: #16a34a; }
    .warn { color: #b45309; }
    pre { background:#0b0f19; color:#d1e7ff; padding: 12px; border-radius: 12px; height: 240px; overflow:auto; margin-top: 12px; }
    code { background:#f3f3f3; padding:2px 6px; border-radius:6px; }
  </style>
</head>

<body>
  <h2>🔥 Subtitle Burner (No Server Upload)</h2>
  <div class="muted">Everything happens on your device inside the browser.</div>

  <div class="card">
    <div class="row">
      <label>Video:
        <input id="video" type="file" accept="video/mp4,video/*">
      </label>
    </div>

    <div class="row">
      <label>SRT:
        <input id="srt" type="file" accept=".srt,text/plain">
      </label>
    </div>

    <div class="row">
      <label>Preset:
        <select id="preset">
          <option value="insta">Instagram Safe (Higher)</option>
          <option value="normal">Normal Bottom</option>
          <option value="netflix">Netflix-ish</option>
        </select>
      </label>

      <button id="btnLoad">1) Load FFmpeg</button>
      <button id="btnBurn" disabled>2) Burn & Download</button>
    </div>

    <progress id="prog" value="0" max="1"></progress>
    <div id="status" class="muted">Not loaded.</div>

    <pre id="logs">Logs...</pre>

    <div class="muted" style="margin-top:10px;">
      <span class="warn">Note:</span> Burning large videos can be slow and may use a lot of RAM.
    </div>
  </div>

  <script type="module">
    import { FFmpeg } from "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js";
    import { fetchFile } from "https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js";

    const ffmpeg = new FFmpeg();
    const $ = (id) => document.getElementById(id);

    const btnLoad = $("btnLoad");
    const btnBurn = $("btnBurn");
    const status = $("status");
    const prog = $("prog");
    const logs = $("logs");

    function log(msg) {
      console.log(msg);
      logs.textContent += "\n" + msg;
      logs.scrollTop = logs.scrollHeight;
    }

    // Make errors visible
    window.addEventListener("error", (e) => {
      log("🔥 window error: " + (e.message || e.error));
      status.innerHTML = `<span style="color:red">Error: ${e.message || e.error}</span>`;
    });
    window.addEventListener("unhandledrejection", (e) => {
      log("🔥 promise error: " + (e.reason?.message || e.reason));
      status.innerHTML = `<span style="color:red">Promise Error: ${e.reason?.message || e.reason}</span>`;
    });

    // FFmpeg events
    ffmpeg.on("log", ({ message }) => {
      log("[ffmpeg] " + message);
    });

    ffmpeg.on("progress", ({ progress }) => {
      prog.value = progress;
      status.textContent = `Progress: ${(progress * 100).toFixed(0)}%`;
    });

    function msToAss(ms) {
      const h = Math.floor(ms / 3600000);
      const m = Math.floor((ms % 3600000) / 60000);
      const s = Math.floor((ms % 60000) / 1000);
      const cs = Math.floor((ms % 1000) / 10);
      return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}.${String(cs).padStart(2, "0")}`;
    }

    function parseSrt(srtText) {
      srtText = srtText.replace(/\r\n/g, "\n");
      const subs = [];
      const blocks = srtText.trim().split(/\n\n+/);

      for (const block of blocks) {
        const lines = block.trim().split("\n");
        if (lines.length < 3) continue;

        const times = lines[1].trim();
        const pattern = new RegExp("(\\d+):(\\d+):(\\d+),(\\d+)\\s*-->\\s*(\\d+):(\\d+):(\\d+),(\\d+)");
        const m = times.match(pattern);
        if (!m) continue;

        const start = (Number(m[1]) * 3600 + Number(m[2]) * 60 + Number(m[3])) * 1000 + Number(m[4]);
        const end   = (Number(m[5]) * 3600 + Number(m[6]) * 60 + Number(m[7])) * 1000 + Number(m[8]);

        const text = lines.slice(2).join(" ").trim();
        if (!text) continue;

        subs.push({ start, end, text });
      }
      return subs;
    }

    function buildAssHeader(preset) {
      let fontSize = 46;
      let outline = 2;
      let shadow = 1;
      let marginV = 220; // insta safe (higher)
      let bold = 0;

      if (preset === "normal") {
        marginV = 60;
      } else if (preset === "netflix") {
        fontSize = 44;
        outline = 3;
        shadow = 0;
        marginV = 160;
        bold = -1;
      }

      return `[Script Info]
Title: Browser Subtitles
ScriptType: v4.00+
Collisions: Normal
PlayResX: 1080
PlayResY: 1920
WrapStyle: 0
ScaledBorderAndShadow: yes

[V4+ Styles]
Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
Style: Default,Roboto,${fontSize},&H00FFFFFF,&H0000FFFF,&H00000000,&H80000000,${bold},0,0,0,100,100,0,0,1,${outline},${shadow},2,60,60,${marginV},1

[Events]
Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
`;
    }

    function buildAssEvents(subs, offset = true) {
      const base = offset && subs.length ? subs[0].start : 0;
      const events = [];

      for (const sub of subs) {
        const start = msToAss(sub.start - base);
        const end = msToAss(sub.end - base);

        const safeText = sub.text.replaceAll("{", "").replaceAll("}", "");
        const styled = `{\\an2\\fad(120,120)}${safeText}`;

        events.push(`Dialogue: 0,${start},${end},Default,,0,0,0,,${styled}`);
      }
      return events.join("\n");
    }

    async function loadFFmpeg() {
      btnLoad.disabled = true;
      status.textContent = "Loading FFmpeg...";
      logs.textContent = "";
      prog.value = 0;

      try {
        const base = `${location.origin}/ffmpeg`;

        // ✅ IMPORTANT: module worker + HTTP URLs (no blobs)
        const coreURL = `${base}/ffmpeg-core.js`;
        const wasmURL = `${base}/ffmpeg-core.wasm`;
        const classWorkerURL = `${base}/ffmpeg.worker.js`;

        log("coreURL: " + coreURL);
        log("wasmURL: " + wasmURL);
        log("classWorkerURL: " + classWorkerURL);

        await ffmpeg.load({
          coreURL,
          wasmURL,
          classWorkerURL,
          workerType: "module",
        });

        status.innerHTML = `<span class="ok">FFmpeg loaded ✅</span>`;
        btnBurn.disabled = false;

        // Quick proof
        await ffmpeg.exec(["-hide_banner", "-version"]);
      } catch (e) {
        console.error(e);
        status.innerHTML = `<span style="color:red;">FFmpeg load failed: ${e?.message || e}</span>`;
        log("❌ LOAD ERROR: " + (e?.message || e));
      } finally {
        btnLoad.disabled = false;
        prog.value = 0;
      }
    }

    async function burn() {
      const videoFile = $("video").files[0];
      const srtFile = $("srt").files[0];

      if (!videoFile || !srtFile) {
        alert("Please select both Video and SRT files.");
        return;
      }

      btnBurn.disabled = true;
      btnLoad.disabled = true;
      prog.value = 0;
      status.textContent = "Reading files...";

      try {
        const srtText = await srtFile.text();
        const subs = parseSrt(srtText);

        if (!subs.length) {
          alert("Could not parse SRT. Make sure it's valid.");
          return;
        }

        const preset = $("preset").value;
        const ass = buildAssHeader(preset) + "\n" + buildAssEvents(subs, true);

        status.textContent = "Writing files into FFmpeg memory...";
        log("Writing input.mp4 + subs.ass...");

        await ffmpeg.writeFile("input.mp4", await fetchFile(videoFile));
        await ffmpeg.writeFile("subs.ass", new TextEncoder().encode(ass));

        status.textContent = "Burning subtitles... (this may take time)";
        log("Running ffmpeg burn...");

       await ffmpeg.exec([
  "-hide_banner",
  "-progress", "pipe:1",
  "-nostats",
  "-y",
  "-i", "input.mp4",
  "-vf", "ass=subs.ass,scale=720:-2",   // ✅ downscale avoids crash
  "-c:v", "libx264",
  "-preset", "ultrafast",
  "-crf", "28",
  "-c:a", "aac",
  "-b:a", "128k",
  "-movflags", "+faststart",
  "output.mp4"
]);



        status.textContent = "Preparing download...";
        const data = await ffmpeg.readFile("output.mp4");

        const outBlob = new Blob([data.buffer], { type: "video/mp4" });
        const url = URL.createObjectURL(outBlob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "subtitled.mp4";
        document.body.appendChild(a);
        a.click();
        a.remove();

        prog.value = 1;
        status.innerHTML = `<span class="ok">Done ✅ Download started</span>`;
      } catch (err) {
        console.error(err);
        status.innerHTML = `<span style="color:red;">Error: ${err?.message || err}</span>`;
        alert("Failed to burn subtitles. Check the logs.");
      } finally {
        btnBurn.disabled = false;
        btnLoad.disabled = false;
      }
    }

    btnLoad.addEventListener("click", loadFFmpeg);
    btnBurn.addEventListener("click", burn);
    log("Ready. Load FFmpeg first.");
  </script>
</body>
</html>
