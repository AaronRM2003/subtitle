<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Custom Subtitles</title>
  <style>
    body {
      margin: 0;
      background: black;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .video-container {
      position: relative;
      width: 360px; /* vertical shorts size */
      height: 640px;
    }

    video {
      width: 100%;
      height: 100%;
    }

    .subtitle {
      position: absolute;
      bottom: 50%;
      width: 100%;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      color: white;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
      font-family: 'Arial', sans-serif;
    }

    #srtInput {
      margin-bottom: 10px;
    }
    span {
  transition: color 0.2s ease;
}
video::-webkit-media-controls {
  display: none !important;
}
video::-webkit-media-controls-enclosure {
  display: none !important;
}



  </style>
</head>
<body>

<h3 style="color:white;">Load SRT</h3>
<input type="file" id="srtInput" accept=".srt">

<div class="video-container">
  <video id="video" controls src="../../../Downloads/video.mp4"></video>
  <div id="subtitle" class="subtitle"></div>
</div>

<script>
let wordList = []; // all words with timing
let windows = [];  // your 30-char windows

// Parse SRT into word-level timings (same as before)
function parseSRTToWords(data) {
  data = data.replace(/\r\n/g, "\n");
  let words = [];

  data.trim().split(/\n\n+/).forEach(block => {
    const lines = block.split("\n");
    if(lines.length < 2) return;

    const time = lines[1].trim();
    const m = time.match(/(\d+):(\d+):(\d+),(\d+)\s*[-]{2}>\s*(\d+):(\d+):(\d+),(\d+)/);
    if(!m) return;

    const startTime = (+m[1]*3600 + +m[2]*60 + +m[3])*1000 + +m[4];
    const endTime   = (+m[5]*3600 + +m[6]*60 + +m[7])*1000 + +m[8];

    const text = lines.slice(2).join(" ").trim();
    const splitWords = text.split(/\s+/);
    const durationPerWord = (endTime - startTime)/splitWords.length;

    splitWords.forEach((word, i) => {
      words.push({
        text: word,
        start: startTime + i*durationPerWord,
        end: startTime + (i+1)*durationPerWord
      });
    });
  });

  return words;
}

// Make 30-char windows
function makeWindows(words) {
  let windows = [];
  let i = 0;

  while (i < words.length) {
    let charCount = 0;
    let windowWords = [];
    let windowStart = words[i].start;
    let windowEnd = words[i].end;

    while (i < words.length && charCount + words[i].text.length + 1 <= 30) {
      windowWords.push(words[i]);
      charCount += words[i].text.length + 1;
      windowEnd = words[i].end;
      i++;
    }

    windows.push({
      words: windowWords,
      start: windowStart,
      end: windowEnd
    });
  }

  return windows;
}

// Load SRT
document.getElementById("srtInput").onchange = async e => {
  const file = e.target.files[0];
  if(file){
    const text = await file.text();
    wordList = parseSRTToWords(text);
    windows = makeWindows(wordList);
    console.log("Windows:", windows);
  }
};

// Highlight word in window
let currentWindowIdx = -1;
video.ontimeupdate = () => {
  const t = video.currentTime * 1000;
  if(!windows.length) return;

  // Find current window
  let winIdx = windows.findIndex(w => t >= w.start && t <= w.end);
  if(winIdx === -1){
    subtitle.innerHTML = '';
    currentWindowIdx = -1;
    return;
  }

  if(winIdx !== currentWindowIdx){
    currentWindowIdx = winIdx;
  }

  // Build HTML for current window
  const words = windows[currentWindowIdx].words;
  let html = '';
  words.forEach(w => {
    if(t >= w.start && t <= w.end){
      html += `<span style="color:#00FFFF">${w.text}</span> `;
    } else {
      html += `<span style="color:white">${w.text}</span> `;
    }
  });
  subtitle.innerHTML = html;
};
</script>


</body>
</html>
